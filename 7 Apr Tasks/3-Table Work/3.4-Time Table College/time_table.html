<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./time_table.css">
</head>
<body>
    <div class="container">
        <h3>TIME TABLE</h3>
        <div class="table-container">    
            <table>
                <tr>
                    <th>Day/Period</th>
                    <th>I<br>9:30-10:20</th>
                    <th>II<br>10:20-11:10</th>
                    <th>III<br>11:10-12:00</th>
                    <th>12:00-12:40</th>
                    <th>IV<br>12:40-1:30</th>
                    <th>V<br>1:30-2:20</th>
                    <th>VI<br>2:20-3:10</th>
                    <th>VII<br>3:10-4:00</th>
                 </tr>
                <tr>
                    <td>Monday</td>
                    <td>Eng</td>
                    <td>Mat</td>
                    <td>Che</td>
                    <td rowspan="5">Lunch</td>
                    <td colspan="3">LAB</td>
                    <td>Phy</td>
                </tr>
                <tr>
                    <td>Tuesday</td>
                    <td colspan="3">LAB</td>
                    <td>Eng</td>
                    <td>Che</td>
                    <td>Mat</td>
                    <td>SPORTS</td>
                </tr>
                <tr>
                    <td>Wednesday</td>
                    <td>Mat</td>
                    <td>Phy</td>
                    <td>Eng</td>
                    <td>Che</td>
                    <td colspan="3">LIBRARY</td>
                </tr>
                <tr>
                    <td>Thursday</td>
                    <td>Phy</td>
                    <td>Eng</td>
                    <td>Che</td>
                    <td colspan="3">LAB</td>
                    <td>Mat</td>
                </tr>
                <tr>
                    <td>Friday</td>
                    <td>Phy</td>
                    <td>Eng</td>
                    <td>Che</td>
                    <td colspan="3">LAB</td>
                    <td>Mat</td>
                </tr>
         </table>
        </div>
    </div>
</body>
</html>
