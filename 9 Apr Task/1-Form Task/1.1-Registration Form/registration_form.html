<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./registration_form.css">
</head>
<body>
    <div class="container">
        <table>
        <tr>
            <th colspan="2">Registration Form</th>
        </tr>
        <tr>
            <td>Student Name</td>
            <td><input type="text" name="studentname"></td>
        </tr>
        <tr>
            <td>Father's Name</td>
            <td><input type="text" name="fathername"></td>
        </tr>
        <tr>
            <td>Mother's Name</td>
            <td><input type="text" name="mothername"></td>
        </tr>
        <tr>
            <td>Date of Birth</td>
            <td><input type="date" name="birthdate"></td>
        </tr>
        <tr>
            <td>Gender</td>
            <td>Male <input type="radio" name="gender" value="male"> Female <input type="radio" name="gender" value="female"></td>
        </tr>
        <tr>
            <td>Email ID</td>
            <td><input type="email"></td>
        </tr>
        <tr>
            <td>Mobile No.</td>
            <td><input type="number"></td>
        </tr>
        <tr id="address">
            <td>Address</td>
            <td><textarea name="address" rows="3"></textarea></td>
        </tr>
        <tr>
            <td>State</td>
            <td><input type="text" name="state"></td>
        </tr>
        <tr>
            <td>City</td>
            <td><input type="text" name="city"></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="submit" name="submit"></td>
        </tr>
    </table>
    </div>
</body>
</html>
