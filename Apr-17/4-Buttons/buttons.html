<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- Buttons Types -->
    <div class="container mt-5">
      <button type="button" class="btn">basic button</button>
      <button type="button" class="btn btn-primary">primary button</button>
      <button type="button" class="btn btn-secondary">secondary button</button>
      <button type="button" class="btn btn-dark">dark button</button>
      <a href="#" class="btn btn-success">link button</a>
      <input type="button" class="btn btn-success" value="input button" />
      <button type="button" class="btn btn-outline-danger">
        outline button
      </button>
    </div>

    <!-- Button Size -->
    <div class="container mt-5">
      <button type="button" class="btn btn-secondary btn-lg">
        large button
      </button>
      <button type="button" class="btn btn-secondary">default button</button>
      <button type="button" class="btn btn-secondary btn-sm">
        small button
      </button>
    </div>

    <!-- Block Level Button -->
    <div class="container mt-5">
      <div class="d-grid gap-3">
        <button type="button" class="btn btn-secondary">
          full width button
        </button>
        <button type="button" class="btn btn-primary">full width button</button>
        <button type="button" class="btn btn-danger">full width button</button>
      </div>
    </div>

    <!-- Active/Disabled Buttons -->
    <div class="container mt-5">
      <button type="button" class="btn btn-primary">Primary Button</button>
      <button type="button" class="btn btn-primary active">
        Active Primary
      </button>
      <button type="button" class="btn btn-primary" disabled>
        Disabled Primary
      </button>
      <a href="#" class="btn btn-primary disabled">Disabled Link</a>
    </div>

    <!-- Spinner Buttons -->
    <div class="container mt-5">
      <button class="btn btn-primary">
        <span class="spinner-border spinner-border-sm"></span>
      </button>

      <button class="btn btn-primary">
        <span class="spinner-border spinner-border-sm"></span>
        Loading..
      </button>

      <button class="btn btn-primary" disabled>
        <span class="spinner-border spinner-border-sm"></span>
        Loading..
      </button>

      <button class="btn btn-primary" disabled>
        <span class="spinner-grow spinner-grow-sm"></span>
        Loading..
      </button>
    </div>
  </body>
</html>
