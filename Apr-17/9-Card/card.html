<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- Basic Card -->
    <div class="container mt-2">
      <div class="card">
        <div class="card-body">Basic card</div>
      </div>
    </div>

    <!-- Header and Footer -->
    <div class="container-fluid mt-5">
      <div class="card">
        <div class="card-header">Header</div>
        <div class="card-body">Content</div>
        <div class="card-footer">Footer</div>
      </div>
    </div>

    <!-- Titles, Text, ans Links -->
    <div class="container mt-5">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Instagram</h4>
          <p class="card-text">Welcome to instagram</p>
          <a href="#" class="card-link">Login link</a>
          <a href="#" class="card-link">Registration link</a>
        </div>
      </div>
    </div>

    <!-- Image Overlay -->
    <div class="container mt-3">
      <div class="card img-fluid" style="width: 500px">
        <img
          class="card-img-top"
          src="../2-Images/assets/elliott-engelmann-DjlKxYFJlTc-unsplash.jpg"
          alt="Card image"
          style="width: 100%"
        >
        <div class="card-img-overlay">
          <h4 class="card-title text-danger">John Doe</h4>
          <p class="card-text text-primary">
            Some example text some example text. Some example text some example
            text. Some example text some example text. Some example text some
            example text.
          </p>
          <a href="#" class="btn btn-primary">See Profile</a>
        </div>
      </div>
    </div>
  </body>
</html>
