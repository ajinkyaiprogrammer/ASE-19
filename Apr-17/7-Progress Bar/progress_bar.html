<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="progress mb-2">
        <div class="progress-bar" style="width: 70%">70%</div>
      </div>
      <div class="progress" style="height: 20px">
        <div class="progress-bar" style="width: 70%">70%</div>
      </div>
      <div class="progress mt-2" style="height: 20px">
        <div class="progress-bar bg-secondary" style="width: 70%">70%</div>
      </div>
      <div class="progress mt-2" style="height: 20px">
        <div
          class="progress-bar bg-secondary progress-bar-striped"
          style="width: 70%"
        >
          70%
        </div>
      </div>
      <div class="progress mt-2" style="height: 20px">
        <div
          class="progress-bar bg-secondary progress-bar-striped progress-bar-animated"
          style="width: 70%"
        >
          70%
        </div>
      </div>
    </div>

    <div class="container mt-3">
      <div class="progress">
        <div class="progress-bar bg-success" style="width: 40%">Free Space</div>
        <div class="progress-bar bg-warning" style="width: 10%">Warning</div>
        <div class="progress-bar bg-danger" style="width: 20%">Danger</div>
      </div>
    </div>
  </body>
</html>
